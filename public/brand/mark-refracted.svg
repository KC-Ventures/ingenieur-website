<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386.48 452.22" width="386.48" height="452.22">
  <title>Ingenieur Labs</title>
  <defs>
    <!-- A still frame of the hero field: silver above one crisp crest leaning up to the
         right, green in the fold below it opening towards citric with depth. -->
    <linearGradient id="field" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="357.6" y2="474.6">
      <stop offset="0" stop-color="#bdb7e6" />
      <stop offset="0.2" stop-color="#d6d6ea" />
      <stop offset="0.34" stop-color="#e8eaf0" />
      <stop offset="0.48" stop-color="#fbfcfd" />
      <stop offset="0.48" stop-color="#009e6a" />
      <stop offset="0.56" stop-color="#00cc7e" />
      <stop offset="0.68" stop-color="#00ff88" />
      <stop offset="0.88" stop-color="#5dfb7e" />
      <stop offset="1" stop-color="#a9f86d" />
    </linearGradient>
    <!-- The sheen where the light catches just above the crest. -->
    <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="190" cy="170" r="150">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- The thin rainbow fringe riding the crest on the silver side, like light on a CD. -->
    <linearGradient id="fringe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="357.6" y2="474.6">
      <stop offset="0.36" stop-color="#ff9ee0" stop-opacity="0" />
      <stop offset="0.39" stop-color="#ff9ee0" stop-opacity="0.55" />
      <stop offset="0.415" stop-color="#a98cff" stop-opacity="0.55" />
      <stop offset="0.44" stop-color="#8fdcff" stop-opacity="0.55" />
      <stop offset="0.46" stop-color="#d9ff9a" stop-opacity="0.55" />
      <stop offset="0.475" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="silver">
      <!-- Everything on the silver side of the crest (offset 0.48 of the gradients). -->
      <path d="M-100 -100H606.7L-100 432.5Z" />
    </clipPath>
